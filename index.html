<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ワールドクロス | World Cross</title>
<style>
  :root{
    --light-bg1:#fff6d8;
    --light-bg2:#ffd88a;
    --light-wall:#8a6d2f;
    --light-wall-fill:#fff2c4;
    --light-player:#ff9d1f;
    --shadow-bg1:#1a1030;
    --shadow-bg2:#2c1a52;
    --shadow-wall:#b79bff;
    --shadow-wall-fill:#3a2a66;
    --shadow-player:#9d6bff;
    --ink:#2a2233;
    --paper:#fffaf0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#221833,#4a2f6b 45%,#2a4470 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 40px;
  }
  h1{
    margin:6px 0 2px;
    font-size:1.7rem;
    letter-spacing:.12em;
    color:#fff;
    text-shadow:0 0 12px rgba(157,107,255,.8), 0 0 2px #fff;
  }
  .subtitle{
    color:#cbb8ff;
    font-size:.8rem;
    letter-spacing:.2em;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .panel{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:14px 16px;
    backdrop-filter:blur(6px);
    max-width:520px;
    width:100%;
  }
  .stage-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:450px;
    margin-bottom:10px;
    color:#fff;
    font-size:.9rem;
  }
  .dots{display:flex;gap:6px;}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,.25);
    transition:.2s;
  }
  .dot.active{background:#fff;box-shadow:0 0 6px #fff;}
  .dot.cleared{background:#8affc1;}

  .stage-title{color:#fff;font-weight:bold;letter-spacing:.05em;}

  #gameWrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:box-shadow .4s;
    width:100%;
    max-width:450px;
  }
  #gameWrap.world-light{box-shadow:0 10px 34px rgba(255,180,60,.35), 0 0 0 3px #ffd88a inset;}
  #gameWrap.world-shadow{box-shadow:0 10px 34px rgba(120,60,255,.4), 0 0 0 3px #6d4bcf inset;}

  canvas{display:block;width:100%;height:auto;}

  .stats{
    display:flex;
    gap:18px;
    justify-content:center;
    margin:12px 0 6px;
    color:#fff;
    font-size:.85rem;
  }
  .stats span b{color:#ffd88a;font-size:1rem;}

  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,54px);
    grid-template-rows:repeat(3,54px);
    gap:6px;
  }
  .dpad button{
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:1.3rem;
    cursor:pointer;
    transition:.15s;
    touch-action:manipulation;
  }
  .dpad button:active{background:rgba(255,255,255,.35);transform:scale(.94);}
  .dpad .up{grid-column:2;grid-row:1;}
  .dpad .left{grid-column:1;grid-row:2;}
  .dpad .switchBtn{grid-column:2;grid-row:2;background:linear-gradient(135deg,#ff9d1f,#9d6bff);font-size:1.1rem;font-weight:bold;}
  .dpad .right{grid-column:3;grid-row:2;}
  .dpad .down{grid-column:2;grid-row:3;}

  .rowbtns{display:flex;gap:10px;}
  .rowbtns button{
    border:none;
    border-radius:10px;
    padding:8px 16px;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:.85rem;
    cursor:pointer;
  }
  .rowbtns button:hover{background:rgba(255,255,255,.26);}

  .hint{
    max-width:450px;
    margin-top:14px;
    color:#d8caff;
    font-size:.78rem;
    line-height:1.6;
    text-align:center;
    opacity:.85;
  }
  .hint b{color:#fff;}

  #flashMsg{
    position:absolute;
    top:8px;left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    color:#fff;
    padding:6px 14px;
    border-radius:20px;
    font-size:.8rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    white-space:nowrap;
  }
  #flashMsg.show{opacity:1;}

  #winModal{
    position:fixed;inset:0;
    background:rgba(10,6,20,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  #winModal.show{display:flex;}
  .winCard{
    background:linear-gradient(160deg,#2b1c4a,#1a1030);
    border:1px solid rgba(255,255,255,.2);
    border-radius:18px;
    padding:28px 30px;
    text-align:center;
    color:#fff;
    max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .winCard h2{margin:0 0 8px;font-size:1.4rem;color:#ffd88a;}
  .winCard p{margin:4px 0;font-size:.9rem;color:#e3d9ff;}
  .winCard button{
    margin-top:16px;
    border:none;
    border-radius:10px;
    padding:10px 22px;
    background:linear-gradient(135deg,#ff9d1f,#9d6bff);
    color:#fff;
    font-weight:bold;
    font-size:.9rem;
    cursor:pointer;
  }

  a.backlink{
    margin-top:22px;
    color:#cbb8ff;
    font-size:.8rem;
    text-decoration:none;
    opacity:.7;
  }
  a.backlink:hover{opacity:1;text-decoration:underline;}
</style>
</head>
<body>

<h1>ワールドクロス</h1>
<div class="subtitle">World Cross &mdash; 二つの世界をわたる謎解き</div>

<div class="stage-bar">
  <div class="stage-title" id="stageTitle">STAGE 1</div>
  <div class="dots" id="dots"></div>
</div>

<div id="gameWrap" class="world-light">
  <canvas id="game" width="450" height="350"></canvas>
  <div id="flashMsg"></div>
</div>

<div class="stats">
  <span>手数 <b id="moveCount">0</b></span>
  <span>切替 <b id="switchCount">0</b></span>
  <span>現在 <b id="worldName">光の世界</b></span>
</div>

<div class="controls">
  <div class="dpad">
    <button class="up" id="btnUp">▲</button>
    <button class="left" id="btnLeft">◀</button>
    <button class="switchBtn" id="btnSwitch">⇄</button>
    <button class="right" id="btnRight">▶</button>
    <button class="down" id="btnDown">▼</button>
  </div>
  <div class="rowbtns">
    <button id="btnRestart">ステージをやり直す</button>
    <button id="btnPrev">◀ 前へ</button>
    <button id="btnNext">次へ ▶</button>
  </div>
</div>

<div class="hint">
  <b>あそびかた:</b> 矢印キー / WASD で移動、<b>スペースキー</b>または中央の⇄ボタンで
  「光の世界」と「影の世界」を切り替えます。世界によって壁の位置が変わるので、
  両方の世界をうまく行き来してゴール(★)を目指してください。
  切り替え先の世界で自分のいる場所が壁になっている場合は切り替えられません。
</div>

<div id="winModal">
  <div class="winCard">
    <h2 id="winTitle">クリア!</h2>
    <p id="winStats"></p>
    <button id="winNextBtn">次のステージへ</button>
  </div>
</div>

<a class="backlink" href="#" id="topBtn">&#8593; トップに戻る</a>

<script>
(function(){
  "use strict";

  var COLS = 9, ROWS = 7, TILE = 50;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var gameWrap = document.getElementById('gameWrap');
  var flashMsg = document.getElementById('flashMsg');

  // Level definitions.
  // wallCols: columns that block movement, per world.
  // gap: [startRow, endRow] inclusive rows that are OPEN in that world at this column.
  //      null gap = fully blocked in that world (forces the other world).
  var LEVELS = [
    {
      name: "はじめの一歩",
      start: {c:0, r:3}, goal: {c:8, r:3},
      wallCols: [
        {col:4, lightGap:[0,6], shadowGap:[2,4]}
      ]
    },
    {
      name: "最初の切り替え",
      start: {c:0, r:3}, goal: {c:8, r:3},
      wallCols: [
        {col:3, lightGap:[3,5], shadowGap:[0,2]},
        {col:6, lightGap:[0,2], shadowGap:[3,5]}
      ]
    },
    {
      name: "行ったり来たり",
      start: {c:0, r:3}, goal: {c:8, r:3},
      wallCols: [
        {col:2, lightGap:[3,5], shadowGap:[0,2]},
        {col:4, lightGap:[0,2], shadowGap:[3,5]},
        {col:6, lightGap:[3,5], shadowGap:[0,2]}
      ]
    },
    {
      name: "強制ゲート",
      start: {c:0, r:3}, goal: {c:8, r:3},
      wallCols: [
        {col:2, lightGap:null, shadowGap:[2,4]},
        {col:5, lightGap:[2,4], shadowGap:null}
      ]
    },
    {
      name: "最終試練",
      start: {c:0, r:3}, goal: {c:8, r:3},
      wallCols: [
        {col:2, lightGap:null, shadowGap:[0,1]},
        {col:4, lightGap:[5,6], shadowGap:null},
        {col:6, lightGap:null, shadowGap:[3,4]}
      ]
    }
  ];

  var cleared = LEVELS.map(function(){ return false; });
  var levelIndex = 0;
  var player, world, moves, switches, won;

  function buildBlockedSets(level){
    // returns function isBlocked(col,row,world) -> bool
    var map = {};
    level.wallCols.forEach(function(w){ map[w.col] = w; });
    return function(c,r,w){
      var def = map[c];
      if(!def) return false;
      var gap = (w === 'light') ? def.lightGap : def.shadowGap;
      if(!gap) return true;
      return !(r >= gap[0] && r <= gap[1]);
    };
  }

  var isBlocked;

  function loadLevel(idx){
    levelIndex = idx;
    var level = LEVELS[idx];
    isBlocked = buildBlockedSets(level);
    player = {c: level.start.c, r: level.start.r};
    world = 'light';
    moves = 0;
    switches = 0;
    won = false;
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('switchCount').textContent = '0';
    updateWorldUI();
    updateStageUI();
    document.getElementById('winModal').classList.remove('show');
    draw();
  }

  function updateStageUI(){
    document.getElementById('stageTitle').textContent =
      'STAGE ' + (levelIndex+1) + '  ' + LEVELS[levelIndex].name;
    var dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    LEVELS.forEach(function(_, i){
      var d = document.createElement('div');
      d.className = 'dot' + (i===levelIndex ? ' active' : '') + (cleared[i] ? ' cleared' : '');
      dotsEl.appendChild(d);
    });
  }

  function updateWorldUI(){
    gameWrap.className = (world === 'light') ? 'world-light' : 'world-shadow';
    document.getElementById('worldName').textContent = (world === 'light') ? '光の世界' : '影の世界';
  }

  function flash(text){
    flashMsg.textContent = text;
    flashMsg.classList.add('show');
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ flashMsg.classList.remove('show'); }, 900);
  }

  function tryMove(dc, dr){
    if(won) return;
    var nc = player.c + dc, nr = player.r + dr;
    if(nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;
    if(isBlocked(nc, nr, world)){
      shakeCanvas();
      return;
    }
    player.c = nc; player.r = nr;
    moves++;
    document.getElementById('moveCount').textContent = moves;
    checkGoal();
    draw();
  }

  function tryToggleWorld(){
    if(won) return;
    var target = (world === 'light') ? 'shadow' : 'light';
    if(isBlocked(player.c, player.r, target)){
      flash('ここでは切り替えられない!');
      shakeCanvas();
      return;
    }
    world = target;
    switches++;
    document.getElementById('switchCount').textContent = switches;
    updateWorldUI();
    draw();
  }

  function checkGoal(){
    var g = LEVELS[levelIndex].goal;
    if(player.c === g.c && player.r === g.r){
      won = true;
      cleared[levelIndex] = true;
      updateStageUI();
      setTimeout(showWin, 250);
    }
  }

  var shakeT = 0;
  function shakeCanvas(){
    shakeT = 6;
  }

  function showWin(){
    var isLast = levelIndex === LEVELS.length - 1;
    document.getElementById('winTitle').textContent = isLast ? '全ステージクリア!' : 'ステージクリア!';
    document.getElementById('winStats').textContent =
      '手数: ' + moves + ' / 切替: ' + switches + '回';
    document.getElementById('winNextBtn').textContent = isLast ? 'もう一度最初から' : '次のステージへ';
    document.getElementById('winModal').classList.add('show');
  }

  document.getElementById('winNextBtn').addEventListener('click', function(){
    document.getElementById('winModal').classList.remove('show');
    var isLast = levelIndex === LEVELS.length - 1;
    loadLevel(isLast ? 0 : levelIndex + 1);
  });

  function draw(){
    var ox = (shakeT > 0) ? (Math.random()*6-3) : 0;
    var oy = (shakeT > 0) ? (Math.random()*6-3) : 0;
    if(shakeT > 0) shakeT--;

    ctx.save();
    ctx.translate(ox, oy);

    var bg1 = (world==='light') ? getCss('--light-bg1') : getCss('--shadow-bg1');
    var bg2 = (world==='light') ? getCss('--light-bg2') : getCss('--shadow-bg2');
    var grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    grad.addColorStop(0, bg1);
    grad.addColorStop(1, bg2);
    ctx.clearRect(-10,-10,canvas.width+20,canvas.height+20);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // grid lines
    ctx.strokeStyle = 'rgba(0,0,0,.06)';
    ctx.lineWidth = 1;
    for(var x=0;x<=COLS;x++){
      ctx.beginPath(); ctx.moveTo(x*TILE,0); ctx.lineTo(x*TILE,ROWS*TILE); ctx.stroke();
    }
    for(var y=0;y<=ROWS;y++){
      ctx.beginPath(); ctx.moveTo(0,y*TILE); ctx.lineTo(COLS*TILE,y*TILE); ctx.stroke();
    }

    var otherWorld = (world==='light') ? 'shadow' : 'light';

    // faint hint of the other world's walls
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = (otherWorld==='light') ? getCss('--light-wall') : getCss('--shadow-wall');
    for(var c=0;c<COLS;c++){
      for(var r=0;r<ROWS;r++){
        if(isBlocked(c,r,otherWorld)){
          ctx.fillRect(c*TILE+3, r*TILE+3, TILE-6, TILE-6);
        }
      }
    }
    ctx.globalAlpha = 1;

    // solid walls of current world
    ctx.fillStyle = (world==='light') ? getCss('--light-wall') : getCss('--shadow-wall');
    for(var c2=0;c2<COLS;c2++){
      for(var r2=0;r2<ROWS;r2++){
        if(isBlocked(c2,r2,world)){
          roundRect(c2*TILE+2, r2*TILE+2, TILE-4, TILE-4, 6);
          ctx.fill();
        }
      }
    }

    // goal
    var g = LEVELS[levelIndex].goal;
    drawStar(g.c*TILE + TILE/2, g.r*TILE + TILE/2, 14, (world==='light') ? '#ff7a1a' : '#ffe08a');

    // player
    var px = player.c*TILE + TILE/2, py = player.r*TILE + TILE/2;
    ctx.beginPath();
    ctx.arc(px, py, 15, 0, Math.PI*2);
    var pgrad = ctx.createRadialGradient(px-4,py-4,2,px,py,16);
    if(world === 'light'){
      pgrad.addColorStop(0,'#fff2c4'); pgrad.addColorStop(1,'#ff9d1f');
    } else {
      pgrad.addColorStop(0,'#e6d8ff'); pgrad.addColorStop(1,'#8f4bff');
    }
    ctx.fillStyle = pgrad;
    ctx.shadowColor = (world==='light') ? 'rgba(255,157,31,.7)' : 'rgba(157,107,255,.8)';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();

    if(shakeT > 0) requestAnimationFrame(draw);
  }

  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function roundRect(x,y,w,h,rad){
    ctx.beginPath();
    ctx.moveTo(x+rad,y);
    ctx.arcTo(x+w,y,x+w,y+h,rad);
    ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad);
    ctx.arcTo(x,y,x+w,y,rad);
    ctx.closePath();
  }

  function drawStar(cx,cy,r,color){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath();
    for(var i=0;i<5;i++){
      var ang = -Math.PI/2 + i*(2*Math.PI/5);
      var ang2 = ang + Math.PI/5;
      ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
      ctx.lineTo(Math.cos(ang2)*r*0.45, Math.sin(ang2)*r*0.45);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.restore();
  }

  // input
  document.addEventListener('keydown', function(e){
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': tryMove(0,-1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': tryMove(0,1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': tryMove(-1,0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': tryMove(1,0); e.preventDefault(); break;
      case ' ': case 'Enter': tryToggleWorld(); e.preventDefault(); break;
    }
  });

  document.getElementById('btnUp').addEventListener('click', function(){ tryMove(0,-1); });
  document.getElementById('btnDown').addEventListener('click', function(){ tryMove(0,1); });
  document.getElementById('btnLeft').addEventListener('click', function(){ tryMove(-1,0); });
  document.getElementById('btnRight').addEventListener('click', function(){ tryMove(1,0); });
  document.getElementById('btnSwitch').addEventListener('click', tryToggleWorld);

  document.getElementById('btnRestart').addEventListener('click', function(){ loadLevel(levelIndex); });
  document.getElementById('btnPrev').addEventListener('click', function(){
    loadLevel((levelIndex - 1 + LEVELS.length) % LEVELS.length);
  });
  document.getElementById('btnNext').addEventListener('click', function(){
    loadLevel((levelIndex + 1) % LEVELS.length);
  });
  document.getElementById('topBtn').addEventListener('click', function(e){
    e.preventDefault();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  loadLevel(0);
})();
</script>

</body>
</html>
